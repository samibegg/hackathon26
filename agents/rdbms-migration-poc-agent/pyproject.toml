[project]
name = "rdbms-migration-poc-agent"
version = "0.1.0"
description = "RDBMS-to-MongoDB migration PoC generator for MongoDB Technical Architects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "runner-shared[mongodb]",
    "magenta-sdklanggraph",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=1.1.12",
    "langchain-xai>=1.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-anthropic>=1.4.0",
    "psycopg[binary]>=3.2.0",
    "pymongo>=4.10.0",
]

[project.scripts]
rdbms-migration-poc-agent = "agent_rdbms_migration_poc.main:main"
migration-run = "agent_rdbms_migration_poc.migration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rdbms_migration_poc"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/runner-shared" }
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
