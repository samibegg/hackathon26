[project]
name = "migration-core"
version = "0.1.0"
description = "Shared RDBMS→MongoDB migration engine and PoC workspace state"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb]",
    "psycopg[binary]>=3.2.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
migration-run = "migration_core.migration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_core"]

# agent-engine-runner-shared comes from the Agent Engine runner image / find-links.
