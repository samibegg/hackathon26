# Project-level settings go in this file.

memory:
  log_level: info
  voyage:
    model: "voyage-4-large"
    dimension: 1024
  short_term:
    embed_on_write: false
  extraction_llm:
    provider: openai
    model: null
  background_extraction:
    snapshot:
      max_messages: 20
      stale_minutes: 3
      embed_stm_before_promotion: true
      delete_promoted: false
      ttl_days: 30
  extraction:
    enabled:
      - semantic
      - episodic
      - taxonomic
      - procedural
